<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
  font-family="Inter, sans-serif"
  height="991"
  id="svg1"
  viewBox="0 -84 1520 991"
  width="1520">
  <sodipodi:namedview
    inkscape:cx="760.0"
    inkscape:cy="495.5"
    inkscape:window-height="1080"
    inkscape:window-maximized="1"
    inkscape:window-width="1920"
    inkscape:window-x="0"
    inkscape:window-y="0"
    inkscape:zoom="0.7"
    id="namedview1"
    showgrid="false" />
  <!--04_02 - Worked results table: one current SUT, six scenarios for the new SUT. Anonymized/illustrative;
    NUMBERS FAKE (matches the raster). Generated by deck/slides/04_02_baseline_results_table/generator.py then
    normalized. Style tokens = CSS classes with literal colours; stable id on every element.-->
  <defs id="defs1">
    <style id="style1">
      .fig { font-family: Inter, sans-serif; }
      .bg { fill: #ffffff; }
      text { fill: #1f2a44; }
      .title { font-size: 42px; font-weight: 800; fill: #16233f; }
      .blocktitle { font-size: 40px; font-weight: 800; fill: #16233f; }
      .subtitle { font-size: 24px; font-weight: 500; fill: #45506a; }
      .subtitle-b { font-weight: 800; fill: #16233f; }
      .thead-fill { fill: #eef1f7; stroke: none; }
      .thead { font-size: 17px; font-weight: 700; fill: #16233f; }
      .rowname { font-size: 21px; font-weight: 700; fill: #1f2a44; }
      .rowcase { font-size: 15px; font-style: italic; fill: #6b7686; }
      .tborder { fill: none; stroke: #d4d9e2; stroke-width: 2; }
      .rowsep { stroke: #e6e9f0; stroke-width: 1.5; }
      .bandfill { fill: #f4f6fb; stroke: none; }
      .bandsep { stroke: #c9d0de; stroke-width: 2; }
      .bandlabel { font-size: 19px; font-weight: 800; fill: #45506a; letter-spacing: 0.4px; }
      .flipfill { fill: #fdf7ee; stroke: none; }
      .runsep { stroke: #e0d3bd; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .runtag { font-size: 16px; font-style: italic; font-weight: 700; fill: #8a6d3b; }
      .rowflip { font-size: 15px; font-style: italic; font-weight: 700; fill: #8a6d3b; }
      .cell { font-size: 23px; font-weight: 500; }
      .cell-b { font-weight: 700; }
      .ci { font-size: 20px; font-weight: 500; fill: #6b7686; }
      .cid { font-size: 20px; font-weight: 500; fill: #1f2a44; }
      .sig { font-size: 26px; font-weight: 800; }
      .foot { font-size: 18px; font-style: italic; fill: #6b7686; }
      .ribbon-band { fill: #eaedf4; fill-opacity: 0.6; stroke: #9aa3b7; stroke-width: 2.5; }
      .ribbon-inner { fill: none; stroke: #9aa3b7; stroke-width: 1.2; }
      .ribbon-t1 { font-size: 27px; font-weight: 800; letter-spacing: 2.4px; fill: #7c8699; }
      .ribbon-t2 { font-size: 15.5px; font-weight: 700; letter-spacing: 0.9px; fill: #7c8699; }
      .t-red { fill: #d32f2f; }
      .t-green { fill: #1b7f3b; }
      .t-blue { fill: #1f4fd6; }
      .t-dark { fill: #45506a; }
    </style>
  </defs>
  <g class="fig" id="fig">
    <rect class="bg" height="991" id="bg" width="1520" x="0" y="-84" />
    <text class="title" id="title" text-anchor="middle" x="760" y="-26">Example results</text>
    <text xml:space="preserve" class="subtitle" id="sub" x="40" y="76"><tspan class="subtitle-b">Current SUT mean total: 90.00 ± 2.80</tspan> (mean ± half-width 95% CI, N = 200, scale 0–100)</text>
    <rect class="thead-fill" height="82" id="thead-bg" rx="10" width="1448" x="36" y="110" />
    <text class="thead" id="h0" text-anchor="start" x="52" y="159">Scenario (new SUT)</text>
    <text class="thead" id="h1a" text-anchor="middle" x="666" y="144">Mean total (0–100)</text>
    <text class="thead" id="h1b" text-anchor="middle" x="666" y="174">[95% CI]</text>
    <text xml:space="preserve" class="thead" id="h2a" text-anchor="middle" x="806" y="144">N</text>
    <text class="thead" id="h2b" text-anchor="middle" x="806" y="174">(dataset)</text>
    <text class="thead" id="h3a" text-anchor="middle" x="956" y="144">μΔ ± 1.96·σΔ/√N</text>
    <text class="thead" id="h3b" text-anchor="middle" x="956" y="174">[95% CI]</text>
    <text class="thead" id="h4" text-anchor="middle" x="1121" y="159">p-value</text>
    <text class="thead" id="h5a" text-anchor="middle" x="1251" y="144">Significant</text>
    <text class="thead" id="h5b" text-anchor="middle" x="1251" y="174">
      (p &lt; 0.05)?
    </text>
    <text class="thead" id="h6a" text-anchor="middle" x="1400" y="144">Needed power</text>
    <text xml:space="preserve" class="thead" id="h6b" text-anchor="middle" x="1400" y="174">(N reject)</text>
    <rect class="bandfill" height="38" id="g0-bg" width="1448" x="36" y="192" />
    <line class="bandsep" id="g0-top" x1="36" x2="1484" y1="192" y2="192" />
    <text class="bandlabel" id="g0-label" x="52" y="218">Clear-cut</text>
    <text class="rowname" id="r0-name" x="52" y="259">significantly better</text>
    <text class="rowcase" id="r0-action" x="52" y="285">deploy the new SUT</text>
    <text class="cell" id="r0-mean" text-anchor="middle" x="666" y="257">95.00 ± 2.45</text>
    <text class="ci" id="r0-ci" text-anchor="middle" x="666" y="287">[92.55, 97.45]</text>
    <text class="cell" id="r0-n" text-anchor="middle" x="806" y="273">200</text>
    <text class="cell cell-b t-green" id="r0-d" text-anchor="middle" x="956" y="257">+5.00 ± 2.08</text>
    <text xml:space="preserve" class="cid" id="r0-cid" text-anchor="middle" x="956" y="287">[<tspan class="t-green">+2.92</tspan>, <tspan class="t-green">+7.08</tspan>]</text>
    <text class="cell" id="r0-p" text-anchor="middle" x="1121" y="273">
      &lt; 0.0001
    </text>
    <text class="sig t-green" id="r0-sig" text-anchor="middle" x="1251" y="276">✓</text>
    <text class="cell cell-b t-blue" id="r0-np" text-anchor="middle" x="1400" y="273">71</text>
    <line class="rowsep" id="rs1" x1="36" x2="1484" y1="300" y2="300" />
    <text class="rowname" id="r1-name" x="52" y="329">significantly worse</text>
    <text class="rowcase" id="r1-action" x="52" y="355">block the deployment</text>
    <text class="cell" id="r1-mean" text-anchor="middle" x="666" y="327">85.50 ± 3.05</text>
    <text class="ci" id="r1-ci" text-anchor="middle" x="666" y="357">[82.45, 88.55]</text>
    <text class="cell" id="r1-n" text-anchor="middle" x="806" y="343">200</text>
    <text class="cell cell-b t-red" id="r1-d" text-anchor="middle" x="956" y="327">−4.50 ± 2.56</text>
    <text xml:space="preserve" class="cid" id="r1-cid" text-anchor="middle" x="956" y="357">[<tspan class="t-red">−7.06</tspan>, <tspan class="t-red">−1.94</tspan>]</text>
    <text class="cell" id="r1-p" text-anchor="middle" x="1121" y="343">0.0006</text>
    <text class="sig t-green" id="r1-sig" text-anchor="middle" x="1251" y="346">✓</text>
    <text class="cell cell-b t-blue" id="r1-np" text-anchor="middle" x="1400" y="343">133</text>
    <rect class="bandfill" height="38" id="g1-bg" width="1448" x="36" y="370" />
    <line class="bandsep" id="g1-top" x1="36" x2="1484" y1="370" y2="370" />
    <text class="bandlabel" id="g1-label" x="52" y="396">Not clear-cut</text>
    <text class="rowname" id="r2-name" x="52" y="437">seems better, but needs more data</text>
    <text class="rowcase" id="r2-action" x="52" y="463">look at other metrics, or collect more data</text>
    <text class="cell" id="r2-mean" text-anchor="middle" x="666" y="435">92.50 ± 2.90</text>
    <text class="ci" id="r2-ci" text-anchor="middle" x="666" y="465">[89.60, 95.40]</text>
    <text class="cell" id="r2-n" text-anchor="middle" x="806" y="451">200</text>
    <text class="cell cell-b t-green" id="r2-d" text-anchor="middle" x="956" y="435">+2.50 ± 2.66</text>
    <text xml:space="preserve" class="cid" id="r2-cid" text-anchor="middle" x="956" y="465">[<tspan class="t-red">−0.16</tspan>, <tspan class="t-green">+5.16</tspan>]</text>
    <text class="cell" id="r2-p" text-anchor="middle" x="1121" y="451">0.0656</text>
    <text class="sig t-dark" id="r2-sig" text-anchor="middle" x="1251" y="454">✗</text>
    <text class="cell cell-b t-blue" id="r2-np" text-anchor="middle" x="1400" y="451">463</text>
    <line class="rowsep" id="rs3" x1="36" x2="1484" y1="478" y2="478" />
    <text class="rowname" id="r3-name" x="52" y="507">seems worse, but needs more data</text>
    <text class="rowcase" id="r3-action" x="52" y="533">look at other metrics, or collect more data</text>
    <text class="cell" id="r3-mean" text-anchor="middle" x="666" y="505">88.00 ± 2.75</text>
    <text class="ci" id="r3-ci" text-anchor="middle" x="666" y="535">[85.25, 90.75]</text>
    <text class="cell" id="r3-n" text-anchor="middle" x="806" y="521">200</text>
    <text class="cell cell-b t-red" id="r3-d" text-anchor="middle" x="956" y="505">−2.00 ± 2.77</text>
    <text xml:space="preserve" class="cid" id="r3-cid" text-anchor="middle" x="956" y="535">[<tspan class="t-red">−4.77</tspan>, <tspan class="t-green">+0.77</tspan>]</text>
    <text class="cell" id="r3-p" text-anchor="middle" x="1121" y="521">0.1573</text>
    <text class="sig t-dark" id="r3-sig" text-anchor="middle" x="1251" y="524">✗</text>
    <text class="cell cell-b t-blue" id="r3-np" text-anchor="middle" x="1400" y="521">785</text>
    <line class="rowsep" id="rs4" x1="36" x2="1484" y1="548" y2="548" />
    <text class="rowname" id="r4-name" x="52" y="577">deeply non-significant</text>
    <text class="rowcase" id="r4-action" x="52" y="603">call them equivalent; decide on cost or latency</text>
    <text class="cell" id="r4-mean" text-anchor="middle" x="666" y="575">89.50 ± 2.60</text>
    <text class="ci" id="r4-ci" text-anchor="middle" x="666" y="605">[86.90, 92.10]</text>
    <text class="cell" id="r4-n" text-anchor="middle" x="806" y="591">200</text>
    <text class="cell cell-b t-red" id="r4-d" text-anchor="middle" x="956" y="575">−0.50 ± 2.43</text>
    <text xml:space="preserve" class="cid" id="r4-cid" text-anchor="middle" x="956" y="605">[<tspan class="t-red">−2.93</tspan>, <tspan class="t-green">+1.93</tspan>]</text>
    <text class="cell" id="r4-p" text-anchor="middle" x="1121" y="591">0.6862</text>
    <text class="sig t-dark" id="r4-sig" text-anchor="middle" x="1251" y="594">✗</text>
    <text class="cell cell-b t-blue" id="r4-np" text-anchor="middle" x="1400" y="591">9615</text>
    <rect class="bandfill" height="38" id="g2-bg" width="1448" x="36" y="618" />
    <line class="bandsep" id="g2-top" x1="36" x2="1484" y1="618" y2="618" />
    <text class="bandlabel" id="g2-label" x="52" y="644">Clear-cut, but tricky</text>
    <rect class="flipfill" height="152" id="r5-fill" width="1448" x="36" y="656" />
    <text class="rowname" id="r5-name" x="52" y="694">significant, but underpowered</text>
    <text class="rowcase" id="r5-action" x="52" y="718">deploy — but it may not replicate</text>
    <text class="rowflip" id="r5-note" x="52" y="744">re-run it and the verdict flips: power is only 63%</text>
    <text class="runtag" id="r5-tag" text-anchor="end" x="560" y="708">run 1</text>
    <text class="cell" id="r5-mean" text-anchor="middle" x="666" y="692">93.50 ± 3.20</text>
    <text class="ci" id="r5-ci" text-anchor="middle" x="666" y="722">[90.30, 96.70]</text>
    <text class="cell" id="r5-n" text-anchor="middle" x="806" y="708">200</text>
    <text class="cell cell-b t-green" id="r5-d" text-anchor="middle" x="956" y="692">+3.50 ± 3.01</text>
    <text xml:space="preserve" class="cid" id="r5-cid" text-anchor="middle" x="956" y="722">[<tspan class="t-green">+0.49</tspan>, <tspan class="t-green">+6.51</tspan>]</text>
    <text class="cell" id="r5-p" text-anchor="middle" x="1121" y="708">0.0225</text>
    <text class="sig t-green" id="r5-sig" text-anchor="middle" x="1251" y="711">✓</text>
    <text class="cell cell-b t-blue" id="r5-np" text-anchor="middle" x="1400" y="708">302</text>
    <line class="runsep" id="r5-runsep" x1="486" x2="1470" y1="732" y2="732" />
    <text class="runtag" id="r5-tag-b" text-anchor="end" x="560" y="772">re-run</text>
    <text class="cell" id="r5-mean-b" text-anchor="middle" x="666" y="756">92.10 ± 3.10</text>
    <text class="ci" id="r5-ci-b" text-anchor="middle" x="666" y="786">[89.00, 95.20]</text>
    <text class="cell" id="r5-n-b" text-anchor="middle" x="806" y="772">200</text>
    <text class="cell cell-b t-green" id="r5-d-b" text-anchor="middle" x="956" y="756">+2.10 ± 2.85</text>
    <text xml:space="preserve" class="cid" id="r5-cid-b" text-anchor="middle" x="956" y="786">[<tspan class="t-red">−0.75</tspan>, <tspan class="t-green">+4.95</tspan>]</text>
    <text class="cell" id="r5-p-b" text-anchor="middle" x="1121" y="772">0.1494</text>
    <text class="sig t-dark" id="r5-sig-b" text-anchor="middle" x="1251" y="775">✗</text>
    <text class="cell cell-b t-blue" id="r5-np-b" text-anchor="middle" x="1400" y="772">756</text>
    <rect class="tborder" height="698" id="tborder" rx="10" width="1448" x="36" y="110" />
    <text class="foot" id="foot1" x="36" y="848">Δ = new SUT mean − current SUT mean (positive = better).</text>
    <text xml:space="preserve" class="foot" id="foot2" x="36" y="882">Needed power = N for 80% power at α = 0.05 to detect the observed Δ.</text>
    <g id="ribbon" transform="rotate(-18 1369.765 224.507)">
      <rect class="ribbon-band" height="84" id="ribbon-outer" width="760" x="820" y="764" />
      <rect class="ribbon-inner" height="68" id="ribbon-inner" width="744" x="828" y="772" />
      <text class="ribbon-t1" id="ribbon-t1" text-anchor="middle" x="1175" y="797">NUMBERS FAKE</text>
      <text class="ribbon-t2" id="ribbon-t2" text-anchor="middle" x="1175" y="824">FOR ILLUSTRATIVE PURPOSES</text>
    </g>
  </g>
</svg>
